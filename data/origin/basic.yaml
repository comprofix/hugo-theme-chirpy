# fonts

webfonts: /lib/fonts/main.css

# Libraries

toc:
  css: /lib/tocbot/dist/tocbot.css
  js: /lib/tocbot/dist/tocbot.min.js

fontawesome:
  css: /lib/fortawesome-fontawesome-free/css/all.min.css

mermaid:
  js: /lib/mermaid/dist/mermaid.min.js

dayjs:
  js:
    common: /lib/dayjs/dayjs.min.js
    locale: /lib/dayjs/locale/:LOCALE.js
    relativeTime: /lib/dayjs/plugin/relativeTime.js
    localizedFormat: /lib/dayjs/plugin/localizedFormat.js

glightbox:
  css: /lib/glightbox/dist/css/glightbox.min.css
  js: /lib/glightbox/dist/js/glightbox.min.js

lazyPolyfill:
  css: /lib/loading-attribute-polyfill/dist/loading-attribute-polyfill.css
  js: /lib/loading-attribute-polyfill/dist/loading-attribute-polyfill.umd.js

clipboard:
  js: /lib/clipboard/dist/clipboard.min.js

# mathjax has no self-hosted path: the mathjax npm package isn't vendored in
# comprofix-chirpy-static-assets, and no content currently sets `math: true`.
# Left pointing at the CDN so it isn't silently broken if that ever changes.
mathjax:
  js: https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js
